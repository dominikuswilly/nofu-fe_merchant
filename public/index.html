<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#4DBA87">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nofu Merchant">
  <meta name="application-name" content="Nofu Merchant">
  <meta name="msapplication-TileColor" content="#4DBA87">
  <meta name="msapplication-config" content="<%= BASE_URL %>browserconfig.xml">

  <!-- Manifest -->
  <link rel="manifest" href="<%= BASE_URL %>manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>icons/favicon-16x16.png">

  <!-- Windows Tiles -->
  <meta name="msapplication-TileImage" content="<%= BASE_URL %>icons/mstile-144x144.png">
  <meta name="msapplication-square70x70logo" content="<%= BASE_URL %>icons/mstile-70x70.png">
  <meta name="msapplication-square150x150logo" content="<%= BASE_URL %>icons/mstile-150x150.png">
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
